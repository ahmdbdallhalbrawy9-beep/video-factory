name: publish-artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a finished render-episode run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy artifact to the renders branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          gh run download "${{ inputs.run_id }}" -n episode -D /tmp/dl
          ls -la /tmp/dl
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan renders
          git rm -rf . -q
          cp /tmp/dl/final.mp4 /tmp/dl/info.json .
          git add final.mp4 info.json
          git commit -q -m "render from run ${{ inputs.run_id }}"
          git push -f origin renders

name: render-episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Path to episode.json"
        default: "episodes/test/episode.json"
  push:
    paths:
      - "episodes/**"
      - "pipeline/**"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3-linux-x64

      - name: Download official Blender (has denoiser, fast)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1

      - name: Install tools (libs, ffmpeg, Arabic fonts)
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
          fc-list :lang=ar | head -3

      - name: Blender version
        run: blender --version | head -2

      - name: Install Python deps
        run: |
          pip install edge-tts gTTS playwright
          python -m playwright install --with-deps chromium

      - name: Build episode
        run: |
          EP="${{ github.event.inputs.episode }}"
          python pipeline/build.py "${EP:-episodes/test/episode.json}" out

      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            out/final.mp4
            out/info.json
          retention-days: 14
